[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "ifc-agent-tools"
version = "0.1.0"
description = "Dependency-light IFC toolkit + MCP server that lets AI agents do quantity take-off, clash detection and natural-ventilation checks on BIM models"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Masood Karamoozian", email = "masood.karamoozian@gmail.com" }]
requires-python = ">=3.10"
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
mcp = ["mcp>=1.2"]
plots = ["matplotlib>=3.7"]
all = ["mcp>=1.2", "matplotlib>=3.7"]

[project.scripts]
ifcagent = "ifcagent.cli:main"
ifcagent-mcp = "ifcagent.mcp_server:main"

[tool.setuptools]
packages = ["ifcagent"]
